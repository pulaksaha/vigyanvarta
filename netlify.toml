[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://vigyanvarta360.onrender.com/api/:splat"
  status = 200
  force = true

# Handle SPA routing (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
